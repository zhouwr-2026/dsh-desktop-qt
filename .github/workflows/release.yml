# DSH Desktop 发布与回归 CI
#
# 触发：
#   * pull_request：开发构建 + 单元测试 + 冒烟
#   * push tag v*：完整发布流程（含 cpack 与 SHA256SUMS 上传 artifact）
#   * workflow_dispatch：手动触发 release 流程（本地验证或非 tag 发布）
#
# 运行器：ubuntu-latest（已含 systemd、polkit、curl）。

name: release

on:
  pull_request:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 手动触发的版本号（用于产物命名；留空则用 PROJECT_VERSION）
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build-test:
    name: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装构建与运行依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            libxcb1-dev libxkbcommon-dev libfontconfig1 libdbus-1-3 \
            qt6-base-dev qt6-svg-dev qt6-webengine-dev qt6-tools-dev qt6-tools-dev-tools \
            nodejs npm systemd polkitd procps fakeroot dpkg-dev

      - name: 配置开发构建
        run: cmake --preset dev

      - name: 编译
        run: cmake --build build/dev --parallel

      - name: 单元测试
        run: ctest --test-dir build/dev --output-on-failure

      - name: 端到端冒烟
        env:
          QT_QPA_PLATFORM: offscreen
        run: bash scripts/smoke.sh

      - name: systemd unit 语法验证
        run: |
          systemd-analyze verify packaging/dsh-theme-export.service
          systemd-analyze verify packaging/dsh-theme-export.path

  release:
    name: release-artifacts
    needs: build-test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装构建与打包依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            libxcb1-dev libxkbcommon-dev libfontconfig1 libdbus-1-3 \
            qt6-base-dev qt6-svg-dev qt6-webengine-dev qt6-tools-dev qt6-tools-dev-tools \
            nodejs npm systemd polkitd procps fakeroot dpkg-dev rpm-build

      - name: 配置发布构建
        run: cmake --preset release

      - name: 编译并测试
        run: |
          cmake --build build/release --parallel
          ctest --test-dir build/release --output-on-failure

      - name: 生成打包产物
        run: bash scripts/package-linux.sh

      - name: 收集产物
        id: collect
        run: |
          mkdir -p artifacts
          # 复制所有打包产物 + 校验和
          find dist -maxdepth 1 -type f \
              \( -name "*.tar.gz" -o -name "*.deb" -o -name "*.rpm" \
                 -o -name "*.pkg.tar.*" -o -name "SHA256SUMS" \) \
              -exec cp -v {} artifacts/ \;
          echo "产物数量：$(ls artifacts/ | wc -l)"

      - name: 上传打包产物
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-${{ github.ref_name || inputs.version || 'manual' }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: error

      - name: 输出 SHA256SUMS
        if: always()
        run: |
          if [ -f artifacts/SHA256SUMS ]; then
            echo "## SHA256SUMS" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat artifacts/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
